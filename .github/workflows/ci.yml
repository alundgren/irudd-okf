name: Product validation
on:
  push:
    branches: [main, okf/product-integration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/native-smoke.mjs
      - run: node scripts/installer-smoke.mjs
      - run: node scripts/bootstrap-smoke.mjs
        if: runner.os != 'Windows'
      - run: node scripts/windows-bootstrap-smoke.mjs
        if: runner.os == 'Windows'
      - run: node scripts/package-release.mjs "${{ runner.temp }}/okf-release"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: ${{ runner.temp }}/okf-release/irudd-okf-*
          if-no-files-found: error
          compression-level: 0
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: OKF_BROWSER_TEST=1 npm test -- packages/web/test/viewer.test.ts
      - run: node scripts/browser-smoke.mjs
        env:
          OKF_BROWSER_ARTIFACTS: ${{ runner.temp }}/okf-browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/okf-browser-smoke/browser-*

  release-packages:
    needs: [native, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/okf-release
      - run: node scripts/release-checksums.mjs "$OKF_RELEASE_DIR"
        env:
          OKF_RELEASE_DIR: ${{ runner.temp }}/okf-release
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/okf-release/*
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: ${{ runner.temp }}/okf-release
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$OKF_RELEASE_DIR"/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OKF_RELEASE_DIR: ${{ runner.temp }}/okf-release

name: Product validation
on:
  push:
    branches: [main, okf/product-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/native-smoke.mjs
      - run: node scripts/installer-smoke.mjs
      - run: node scripts/bootstrap-smoke.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: OKF_BROWSER_TEST=1 npm test -- packages/web/test/viewer.test.ts
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/validation/browser-*
